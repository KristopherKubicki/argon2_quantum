[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argon2-quantum"
version = "0.2.0"
description = "Versioned Argon2id password records with local or AWS KMS HMAC protection"
readme = "README.md"
authors = [{name = "Kristopher Kubicki"}]
requires-python = ">=3.10"
dependencies = ["argon2-cffi>=25.1.0,<26"]

[project.optional-dependencies]
aws = ["boto3>=1.43.0,<2"]
quantum = ["amazon-braket-sdk>=1.80.0,<2"]
dev = [
    "pytest>=8,<10", "pytest-cov>=5,<8", "pre-commit>=4,<5",
    "ruff==0.16.8", "bandit==1.9.4", "build>=1,<2", "pip-audit>=2.10,<3",
    "aws-cdk-lib==2.270.0", "constructs>=10.3,<11", "boto3>=1.43.0,<2",
]

[project.scripts]
qs_kdf = "qs_kdf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["qsargon2"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B"]
